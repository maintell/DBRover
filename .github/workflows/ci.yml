name: CI

# 只做测试，不打包、不发版。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: test
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - name: test with race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  webui:
    name: webui syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: check app.js parses
        run: node --check internal/webui/app.js
