name: Release

# 发版只由 tag 触发。PR 与普通分支推送不会进入本流水线。
on:
  push:
    tags:
      - 'v*'

# 一次发版只应产生一条流水线：并发组固定，不按事件区分。
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

# 这里只做「编译 + 发布」。
# 格式、vet、单测、文档一致性等检查都在打 tag 之前于本地完成（scripts/check.ps1）。
jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          bin=dbrover
          if [ "$GOOS" = "windows" ]; then bin=dbrover.exe; fi
          mkdir -p out
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "out/$bin" ./cmd/dbrover
          if [ "$GOOS" = "windows" ]; then
            (cd out && zip -q "../dbrover_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.zip" "$bin")
          else
            tar -C out -czf "dbrover_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}.tar.gz" "$bin"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dbrover-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dbrover_*.zip
            dbrover_*.tar.gz
          if-no-files-found: error

  # 桌面壳（Wails v2 / WebView2）：只发 Windows，因为 macOS/Linux 的 Wails 需要
  # CGO，与本仓库的 CGO_ENABLED=0 交叉编译矩阵冲突（ADR-0017 §7）。
  # 与 CLI 同属一条流水线、一个并发组、一个 publish；不新建第二条发版路径。
  desktop:
    name: build desktop windows/amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build desktop shell
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          Push-Location cmd/dbrover-desktop
          # -H=windowsgui：双击启动不弹控制台窗口。Wails 在 Windows 走 go-webview2
          # （纯 Go syscall），CGO_ENABLED=0 即可，WebView2Loader 由 go-webview2 内嵌。
          # Wails v2 编译期要求：不带 production tag 时 Windows 会链接进
          # internal/app/app_default_windows.go 的 stub（弹「will not build without
          # the correct build tags」错误框就退出），go build 照样返回 0、CI 照样绿。
          # 带 -tags production 才链接 app_production.go 的真实 CreateApp，并内嵌 runtime JS。
          go build -tags production -trimpath -ldflags "-s -w -H=windowsgui" -o ../../out/dbrover-desktop.exe .
          Pop-Location
          $zip = "dbrover-desktop_$($env:GITHUB_REF_NAME)_windows_amd64.zip"
          Compress-Archive -Path out/dbrover-desktop.exe -DestinationPath $zip

      - uses: actions/upload-artifact@v4
        with:
          name: dbrover-desktop-windows-amd64
          path: dbrover-desktop_*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
